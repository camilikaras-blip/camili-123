    <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sua Loja Country | Botas Texanas Femininas</title>
    <style>
        /* Estilos Gerais (Visual Country Moderno) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #fcf8f2;
            color: #3e2723;
        }

        /* Cabeçalho */
        header {
            background-color: #4a2c11;
            color: #f3e5ab;
            text-align: center;
            padding: 2rem 1rem;
            border-bottom: 4px solid #8d6e63;
        }

        header h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        header p {
            font-size: 1.1rem;
            margin-top: 5px;
            color: #d7ccc8;
        }

        /* Container Principal */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .titulo-secao {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1.8rem;
            color: #4a2c11;
            border-bottom: 2px solid #d7ccc8;
            padding-bottom: 10px;
        }

        /* Grade de Produtos */
        .grid-produtos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        /* Card do Produto */
        .card-produto {
            background-color: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-produto:hover {
            transform: translateY(-5px);
        }

        .card-produto img {
            width: 100%;
            height: 280px;
            object-fit: cover;
        }

        .info-produto {
            padding: 1.2rem;
            text-align: center;
        }

        .info-produto h3 {
            font-size: 1.3rem;
            color: #3e2723;
            margin-bottom: 0.5rem;
        }

        .info-produto .detalhes {
            font-size: 0.9rem;
            color: #6d4c41;
            margin-bottom: 0.8rem;
        }

        .info-produto .preco {
            font-size: 1.4rem;
            font-weight: bold;
            color: #2e7d32;
            margin-bottom: 1rem;
        }

        /* Botão do WhatsApp */
        .btn-whatsapp {
            display: inline-block;
            width: 100%;
            background-color: #25d366;
            color: #fff;
            text-decoration: none;
            padding: 0.8rem 0;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .btn-whatsapp:hover {
            background-color: #128c7e;
        }

        /* Rodapé */
        footer {
            background-color: #3e2723;
            color: #d7ccc8;
            text-align: center;
            padding: 1.5rem;
            margin-top: 3rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>👢 Brutal & Elegante</h1>
        <p>As melhores botas texanas femininas em couro legítimo</p>
    </header>

    <main class="container">
        <h2 class="titulo-secao">Coleção Botas Texanas</h2>

        <div class="grid-produtos">

            <div class="card-produto">
                <img src="https://via.placeholder.com/400x400?text=Texana+Bordada" alt="Bota Texana Bordada">
                <div class="info-produto">
                    <h3>Texana Bordada Flor</h3>
                    <p class="detalhes">Couro Bovino | Bico Quadrado | Tam: 34 ao 39</p>
                    <p class="preco">
